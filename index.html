<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus HR — Feature Karte</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 24px;
    }

    .product-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 20px 45px rgba(31, 25, 68, 0.25);
      transition: box-shadow 0.4s ease;
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    .product-card:hover {
      box-shadow: 0 30px 60px rgba(31, 25, 68, 0.35);
    }

    .product-card__badge {
      display: inline-block;
      padding: 6px 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    .product-card__title {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .product-card__subtitle {
      font-size: 15px;
      color: #6b7280;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .product-card__features {
      list-style: none;
      margin-bottom: 28px;
    }

    .product-card__features li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      font-size: 15px;
      color: #374151;
      line-height: 1.45;
    }

    .product-card__features li::before {
      content: "✓";
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #ffffff;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 700;
      margin-top: 1px;
    }

    .product-card__price {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 24px;
    }

    .product-card__price-value {
      font-size: 34px;
      font-weight: 700;
      color: #1a1a2e;
    }

    .product-card__price-period {
      font-size: 14px;
      color: #6b7280;
    }

    .product-card__cta {
      display: block;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card__cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    .product-card__cta:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <article class="product-card" id="productCard">
    <span class="product-card__badge">Neu</span>
    <h1 class="product-card__title">Focus HR Pro</h1>
    <p class="product-card__subtitle">Die smarte HR-Plattform für moderne Teams.</p>
    <ul class="product-card__features">
      <li>Automatisierte Bewerberverwaltung</li>
      <li>Nahtlose Kalender-Integration</li>
      <li>DSGVO-konforme Datenhaltung</li>
      <li>Echtzeit-Analytics für Teams</li>
    </ul>
    <div class="product-card__price">
      <span class="product-card__price-value">€29</span>
      <span class="product-card__price-period">/ Monat pro Nutzer</span>
    </div>
    <button type="button" class="product-card__cta">Jetzt kostenlos testen</button>
  </article>
  <script>
    $(function () {
      var $card = $('#productCard');
      var rotationDegrees = 360;
      var rotationDuration = 800;

      $card.css({
        'transition': 'transform ' + rotationDuration + 'ms ease, box-shadow 0.4s ease'
      });

      $card.on('mouseenter', function () {
        $(this).css('transform', 'rotateY(' + rotationDegrees + 'deg)');
      });

      $card.on('mouseleave', function () {
        $(this).css('transform', 'rotateY(0deg)');
      });
    });
  </script>
</body>
</html>
